name: Release
# A release is published when CI passes on main and MARKETING_VERSION in project.yml has no tag yet.
# Bump the version and add ReleaseNotes/<version>.md to ship. Run it by hand to retry a failed release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write # Only the final release step uses this token.
      actions: read # Reads the CI result for the released commit.
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version and check that it is new
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "error: run this workflow on main" >&2; exit 1; }
            conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$SHA" \
              --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
            [[ "$conclusion" == success ]] || { echo "error: CI for $SHA is '${conclusion:-not finished}'" >&2; exit 1; }
          fi
          version=$(sed -n 's/^ *MARKETING_VERSION: *//p' project.yml | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "error: bad MARKETING_VERSION '$version'" >&2; exit 1; }
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump MARKETING_VERSION to publish a new one." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes="ReleaseNotes/$version.md"
          python3 -I scripts/make-appcast.py --check-notes "$notes"
          {
            echo "publish=true"
            echo "version=$version"
            echo "notes=$notes"
          } >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        if: steps.version.outputs.publish == 'true'
        run: brew install xcodegen

      - name: Build the disk image
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "MACGACHA_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "MACGACHA_DERIVED_DATA_PATH=$RUNNER_TEMP/macgacha-release-dd" >> "$GITHUB_ENV"
          MACGACHA_BUILD_NUMBER=$(git rev-list --count HEAD) MACGACHA_DERIVED_DATA_PATH="$RUNNER_TEMP/macgacha-release-dd" \
            scripts/package-dmg.sh "$VERSION" out

      # In-app updates need the owner's Sparkle key. Without the secret the release still ships, without an appcast.
      - name: Sign the update and write the appcast
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]]; then
            echo "No SPARKLE_ED_PRIVATE_KEY secret: publishing without an appcast." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          signer=$(find "$MACGACHA_DERIVED_DATA_PATH/SourcePackages/artifacts" -type f -path '*/bin/sign_update' -print -quit)
          [[ -n "$signer" && -x "$signer" ]] || { echo "error: Sparkle sign_update was not found" >&2; exit 1; }
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/macgacha-sparkle-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_file"
          unset SPARKLE_ED_PRIVATE_KEY
          if ! signature=$("$signer" --ed-key-file "$key_file" -p "out/MacGacha-$VERSION.dmg" 2>/dev/null); then
            echo "error: Sparkle could not sign the update" >&2
            exit 1
          fi
          public_key=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$MACGACHA_DERIVED_DATA_PATH/Build/Products/Release/MacGacha.app/Contents/Info.plist")
          xcrun swift -warnings-as-errors scripts/verify-sparkle-signature.swift "out/MacGacha-$VERSION.dmg" "$public_key" "$signature"
          python3 -I scripts/make-appcast.py --release "$VERSION" --build-number "$MACGACHA_BUILD_NUMBER" \
            --dmg "out/MacGacha-$VERSION.dmg" --signature "$signature" --notes "$RELEASE_NOTES" --output out/appcast.xml
          python3 -I -c 'import xml.etree.ElementTree as ET; ET.parse("out/appcast.xml")'

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          assets=("out/MacGacha-$VERSION.dmg" "out/MacGacha-$VERSION.dmg.sha256")
          [[ -f out/appcast.xml ]] && assets+=(out/appcast.xml)
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --latest \
            --title "MacGacha4Life $VERSION" --target "$SHA" --notes-file "$RELEASE_NOTES" "${assets[@]}"
          echo "Published v$VERSION." >> "$GITHUB_STEP_SUMMARY"
